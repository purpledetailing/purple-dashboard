<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Purple Dashboard - VIN Search</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root {
  --purple-main: #5b1fa6;
  --purple-dark: #3b0764;
  --text-main: #0f172a;
  --text-muted: #6b7280;
  --bg-main: #f9fafb;
  --card-bg: #ffffff;
  --border-soft: #e5e7eb;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui;
}

body {
  background: var(--bg-main);
  display: flex;
  justify-content: center;
  padding: 40px 16px;
}

.container {
  max-width: 1000px;
  width: 100%;
}

.card {
  background: #fff;
  border-radius: 18px;
  padding: 20px;
  border: 1px solid var(--border-soft);
}

/* 🔥 UPDATED HEADER */
.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.panel-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.edit-btn {
  border-radius: 999px;
  border: 1px solid var(--border-soft);
  padding: 6px 12px;
  font-size: 0.75rem;
  font-weight: 700;
  background: #f9fafb;
  cursor: pointer;
}

.edit-btn:hover {
  background: #f3f4f6;
}

.badge {
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 0.7rem;
}

.badge.active {
  background: #ecfdf3;
}

.edit-section {
  display: none;
  margin-top: 12px;
  padding: 12px;
  border: 1px dashed var(--border-soft);
}
</style>
</head>

<body>
<div class="container">
<div class="card">

<!-- 🔥 HEADER WITH BUTTON MOVED -->
<div class="panel-header">
  <div class="panel-title">Customer & Vehicle</div>

  <div class="panel-actions">
    <div id="statusBadge"></div>

    <button id="editCustomerBtn" class="edit-btn">
      Edit
    </button>
  </div>
</div>

<!-- CUSTOMER INFO -->
<div style="margin-top:15px;">
  <div><b>Customer:</b> <span id="customerName">—</span></div>
  <div><b>Phone:</b> <span id="phoneNumber"></span></div>
  <div><b>Address:</b> <span id="address"></span></div>
  <div><b>Vehicle:</b> <span id="mmYear"></span></div>
</div>

<!-- 🔥 EDIT SECTION (UNCHANGED LOGIC) -->
<div id="editCustomerSection" class="edit-section">
  <input id="editName" placeholder="Name" />
  <input id="editPhone" placeholder="Phone" />
  <input id="editEmail" placeholder="Email" />

  <div style="margin-top:10px;">
    <button id="saveCustomerBtn">Save</button>
    <button id="cancelEditBtn">Cancel</button>
  </div>
</div>

</div>
</div>

<script>
const btn = document.getElementById("editCustomerBtn");
const section = document.getElementById("editCustomerSection");

btn.onclick = () => {
  section.style.display =
    section.style.display === "block" ? "none" : "block";
};

document.getElementById("cancelEditBtn").onclick = () => {
  section.style.display = "none";
};
</script>

</body>
</html>
