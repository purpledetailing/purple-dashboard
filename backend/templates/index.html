<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Purple Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
/* --- KEEP YOUR EXISTING STYLES --- */
/* ADD BELOW */

.panel-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.edit-icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: #0f172a;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.edit-icon-btn:hover {
  background: #5b1fa6;
}

/* --- MODAL --- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal {
  width: 100%;
  max-width: 500px;
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.modal-header {
  font-weight: 700;
  margin-bottom: 10px;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}
</style>
</head>

<body>

<div class="panel">

  <div class="panel-header">
    <div class="panel-title">Customer & Vehicle</div>

    <div class="panel-actions">
      <div id="statusBadge"></div>

      <!-- ✏️ ICON BUTTON -->
      <button id="editCustomerBtn" class="edit-icon-btn" title="Edit">
        ✏️
      </button>
    </div>
  </div>

  <!-- YOUR EXISTING INFO GRID HERE -->

</div>

<!-- 🔥 MODAL -->
<div id="editModal" class="modal-overlay">
  <div class="modal">

    <div class="modal-header">Edit Customer</div>

    <input id="editName" placeholder="Full Name" class="search-input" />
    <input id="editPhone" placeholder="Phone" class="search-input" />
    <input id="editEmail" placeholder="Email" class="search-input" />
    <input id="editAddress" placeholder="Address" class="search-input" />
    <input id="editZip" placeholder="Zip Code" class="search-input" />

    <div class="modal-actions">
      <button id="saveCustomerBtn" class="search-button">Save</button>
      <button id="cancelEditBtn" class="secondary-button">Cancel</button>
    </div>

    <div id="saveStatus" class="edit-status"></div>

  </div>
</div>

<script>
const editBtn = document.getElementById("editCustomerBtn");
const modal = document.getElementById("editModal");
const cancelBtn = document.getElementById("cancelEditBtn");

// OPEN MODAL
editBtn.addEventListener("click", () => {
  if (!currentCanEditCustomer) return;
  modal.style.display = "flex";
});

// CLOSE MODAL
cancelBtn.addEventListener("click", () => {
  modal.style.display = "none";
});

// CLICK OUTSIDE CLOSE
modal.addEventListener("click", (e) => {
  if (e.target === modal) {
    modal.style.display = "none";
  }
});

// AFTER SAVE
saveCustomerBtn.addEventListener("click", async () => {
  // keep your existing save logic
  modal.style.display = "none";
});
</script>

</body>
</html>
