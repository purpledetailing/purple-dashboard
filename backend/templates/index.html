<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Purple Dashboard - VIN Search</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root {
  --purple-main: #5b1fa6;
  --purple-dark: #3b0764;
  --text-main: #0f172a;
  --text-muted: #6b7280;
  --bg-main: #f9fafb;
  --card-bg: #ffffff;
  --border-soft: #e5e7eb;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui;
}

body {
  background: var(--bg-main);
  display: flex;
  justify-content: center;
  padding: 40px 16px;
}

.container {
  max-width: 1000px;
  width: 100%;
}

.card {
  background: #fff;
  border-radius: 18px;
  padding: 24px;
  border: 1px solid var(--border-soft);
}

/* HEADER */
.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.panel-title {
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
}

.panel-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.edit-btn {
  border-radius: 999px;
  border: 1px solid var(--border-soft);
  padding: 6px 12px;
  font-size: 0.75rem;
  font-weight: 700;
  background: #f9fafb;
  cursor: pointer;
}

.edit-btn:hover {
  background: #f3f4f6;
}

/* BADGE */
.badge {
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 0.7rem;
}

.badge.active {
  background: #ecfdf3;
}

/* INFO */
.info-row {
  margin-bottom: 10px;
  font-size: 0.9rem;
}

.info-row b {
  color: var(--text-muted);
  font-weight: 600;
  margin-right: 6px;
}

/* EDIT SECTION */
.edit-section {
  display: none;
  margin-top: 18px;
  padding: 14px;
  border: 1px dashed var(--border-soft);
  border-radius: 10px;
  background: #fafafa;
}

.edit-section input {
  width: 100%;
  margin-bottom: 8px;
  padding: 10px 12px;
  border-radius: 999px;
  border: 1px solid var(--border-soft);
  font-size: 0.9rem;
  outline: none;
}

.edit-section input:focus {
  border-color: var(--purple-main);
}

/* BUTTON ROW */
.edit-actions {
  margin-top: 10px;
  display: flex;
  gap: 8px;
}

.edit-actions button {
  border-radius: 999px;
  padding: 8px 14px;
  border: none;
  cursor: pointer;
  font-size: 0.85rem;
}

#saveCustomerBtn {
  background: #000;
  color: #fff;
}

#cancelEditBtn {
  background: #f3f4f6;
}
</style>
</head>

<body>
<div class="container">
<div class="card">

<!-- HEADER -->
<div class="panel-header">
  <div class="panel-title">Customer & Vehicle</div>

  <div class="panel-actions">
    <div id="statusBadge" class="badge active">ACTIVE</div>

    <button id="editCustomerBtn" class="edit-btn">
      Edit
    </button>
  </div>
</div>

<!-- CUSTOMER INFO -->
<div>
  <div class="info-row"><b>Customer:</b> <span id="customerName">—</span></div>
  <div class="info-row"><b>Phone:</b> <span id="phoneNumber"></span></div>
  <div class="info-row"><b>Address:</b> <span id="address"></span></div>
  <div class="info-row"><b>Vehicle:</b> <span id="mmYear"></span></div>
</div>

<!-- EDIT SECTION -->
<div id="editCustomerSection" class="edit-section">
  <input id="editName" placeholder="Name" />
  <input id="editPhone" placeholder="Phone" />
  <input id="editEmail" placeholder="Email" />

  <div class="edit-actions">
    <button id="saveCustomerBtn">Save</button>
    <button id="cancelEditBtn">Cancel</button>
  </div>
</div>

</div>
</div>

<script>
const btn = document.getElementById("editCustomerBtn");
const section = document.getElementById("editCustomerSection");

btn.onclick = () => {
  section.style.display =
    section.style.display === "block" ? "none" : "block";
};

document.getElementById("cancelEditBtn").onclick = () => {
  section.style.display = "none";
};
</script>

</body>
</html>
