<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>
    {% if vehicle %}
      {{ vehicle.year }} {{ vehicle.make }} {{ vehicle.model }} · Purple Report
    {% else %}
      Vehicle Not Found · Purple Report
    {% endif %}
  </title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --purple: #6d28d9;
      --purple-soft: #ede9fe;
      --bg-page: #f9fafb;
      --bg-card: #ffffff;
      --border-subtle: #e5e7eb;
      --text-main: #111827;
      --text-muted: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    .page {
      width: 100%;
      max-width: 1000px;
    }

    header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .brand-subtitle span {
      color: var(--purple);
      font-weight: 600;
    }

    .vin-tag {
      font-size: 0.75rem;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: #ffffff;
      color: var(--text-muted);
      display: inline-flex;
      gap: 6px;
      align-items: center;
      white-space: nowrap;
    }

    .vin-tag strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .card {
      background: var(--bg-card);
      border-radius: 18px;
      border: 1px solid var(--border-subtle);
      padding: 20px 22px 24px;
      box-shadow: 0 12px 25px rgba(15, 23, 42, 0.04);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .vehicle-title {
      font-size: 1.35rem;
      font-weight: 600;
    }

    .vehicle-meta {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 4px 12px;
      background: #111827;
      color: #ffffff;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.4fr);
      gap: 18px;
    }

    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
    }

    .panel {
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      padding: 14px 16px 16px;
    }

    .panel-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .info-item { margin-bottom: 10px; }

    .info-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
    }

    .info-value {
      font-size: 0.95rem;
      font-weight: 500;
      word-break: break-word;
    }

    /* ✅ FIXED SERVICE HEADER */
    .service-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap; /* 🔥 allows clean mobile wrapping */
      margin-top: 14px;
      margin-bottom: 10px;
    }

    .service-count {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0; /* 🔥 prevents distortion */
    }

    .service-count .pill {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--text-main);
      font-weight: 700;
      line-height: 1;
      font-size: 0.9rem;
    }

    #serviceHistoryWrap.is-collapsed {
      display: none;
    }

    .service-item {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: #f9fafb;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .service-top {
      display: flex;
      justify-content: space-between;
    }

    .service-details {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-subtle);
    }

    .service-item.is-open .service-details { display: block; }

  </style>
</head>

<body>
  <div class="page">
    <header>
      <div>
        <div class="brand-title">Purple Dashboard</div>
        <div class="brand-subtitle">
          Verified Cosmetic History snapshot by <span>PurpleVin</span>
        </div>
      </div>
      <div class="vin-tag">
        VIN <strong>{{ vin }}</strong>
      </div>
    </header>

    <main class="card">
      <div class="service-header">
        <div class="panel-title" style="margin:0;">Service History</div>

        <div class="service-count" id="svcToggleBtn">
          <span class="pill" id="svcMasterPm">−</span>
          <span>{{ service_history|length }} service records</span>
        </div>
      </div>

      <div id="serviceHistoryWrap">
        {% for entry in service_history %}
          <div class="service-item {% if loop.first %}is-open{% endif %}">
            <div class="service-top">
              <div>{{ entry.service_type }}</div>
              <div>Details</div>
            </div>
            <div class="service-details">
              {{ entry.service_description }}
            </div>
          </div>
        {% endfor %}
      </div>
    </main>
  </div>

<script>
const wrap = document.getElementById("serviceHistoryWrap");
const toggleBtn = document.getElementById("svcToggleBtn");
const masterPm = document.getElementById("svcMasterPm");

toggleBtn.onclick = () => {
  const collapsed = wrap.classList.toggle("is-collapsed");
  masterPm.textContent = collapsed ? "+" : "−";
};
</script>

</body>
</html>
